lang: zh-CN
timezone: Asia/Shanghai

title: 思考，记录
tagline: 培养好奇心，培养兴趣，日拱一卒
description: >-
  又使众人都明白，这历代以来隐藏在创造万物之神里的奥秘，是如何安排的。（以弗所书3:9）
url: "https://xuleixie.github.io"
baseurl: ""
repository: xuleixie/xuleixie.github.io

twitter:
  username: xiexulei3

social:
  name: xulei Xie
  email: xuleixie@gmail.com
  links:
    - https://github.com/xuleixie
    - https://x.com/xiexulei3

theme_mode: dual

avatar: ""

toc: true

paginate: 10

collections:
  tabs:
    output: true
    permalink: /:name/

plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-remote-theme

remote_theme: pages-themes/hacker@v0.2.0


jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - rollup.config.js
  - package*.json
  - node_modules
  - vendor
