---
layout: default
---

<h1>标签：{{ page.title }}</h1>

{% assign posts = page.posts | default: site.tags[page.title] %}
{% if posts and posts.size > 0 %}
  <ul class="post-list">
    {% for post in posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>该标签下暂无文章。</p>
{% endif %}
